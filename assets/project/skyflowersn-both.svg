<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .wordmark{ font-family:'Caveat', cursive; font-weight:700; }
    </style>

    <radialGradient id="bgRed" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#8B1538"/>
      <stop offset="55%" stop-color="#6B0F2A"/>
      <stop offset="100%" stop-color="#3E0A1C"/>
    </radialGradient>

    <linearGradient id="petalCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="100%" stop-color="#FFE3EA"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB6CC"/>
      <stop offset="100%" stop-color="#FF6B96"/>
    </linearGradient>
    <linearGradient id="petalSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEBAE"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </linearGradient>

    <radialGradient id="lensGlass" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFE3EA"/>
      <stop offset="100%" stop-color="#FF9DB6"/>
    </radialGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEFF2"/>
    </linearGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="500" height="500" fill="url(#bgRed)"/>

  <!-- glow behind flower -->
  <circle cx="250" cy="226" r="210" fill="url(#flowerGlow)"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M74 108 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
  </g>
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="418" cy="150" r="5.5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="430" cy="360" r="4.5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.7">
    <path d="M60 372 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
  </g>

  <!-- flower -->
  <g transform="translate(250,250)">
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalPink)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalCream)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalSun)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalPink)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalCream)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-100" rx="54" ry="70" fill="url(#petalSun)" transform="rotate(300)"/>
  </g>

  <!-- camera -->
  <g transform="translate(250,254)">
    <path d="M-118 -9 Q-148 -59 -98 -89" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M118 -9 Q148 -59 98 -89" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>

    <rect x="-43" y="-118" width="86" height="33" rx="13" fill="#FF8FAE" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="39" cy="-109" r="7.5" fill="#FFF" stroke="#6B0F2A" stroke-width="2.5"/>

    <rect x="-136" y="-91" width="272" height="186" rx="42" fill="url(#bodyGrad)" stroke="#FFFFFF" stroke-width="6.5"/>

    <rect x="-113" y="-68" width="33" height="23" rx="6" fill="#FFCB57" stroke="#E9A62A" stroke-width="3"/>

    <circle cx="0" cy="14" r="77" fill="#FFFFFF" stroke="#8B1538" stroke-width="8"/>
    <circle cx="0" cy="14" r="62" fill="#FF8FAE"/>
    <circle cx="0" cy="14" r="49" fill="url(#lensGlass)" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-17" cy="-3" r="12" fill="#FFFFFF" opacity="0.9"/>

    <path d="M0 26 C-10 15 -26 15 -26 1 C-26 -9 -16 -13 -9 -7 C-4 -2 0 4 0 4 C0 4 4 -2 9 -7 C16 -13 26 -9 26 1 C26 15 10 15 0 26 Z"
          fill="#8B1538" opacity="0.95" transform="translate(0,-7) scale(0.54)"/>

    <circle cx="104" cy="-68" r="13" fill="#8B1538"/>
    <circle cx="104" cy="-68" r="6" fill="#FFE3EA"/>
  </g>
</svg>
